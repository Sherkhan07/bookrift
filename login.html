<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>BookRift — Кіру</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- styles.css логинсіз жабық, сондықтан стиль осы жерде -->
    <style>
      :root {
        --primary: #8d7dff;
        --primary-2: #5ad1ff;
        --text: #eef4ff;
        --muted: #aab7d4;
        --line: rgba(255, 255, 255, 0.1);
        --danger: #ff8a9a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(circle at 15% 15%, rgba(141, 125, 255, 0.22), transparent 25%),
          radial-gradient(circle at 85% 20%, rgba(90, 209, 255, 0.2), transparent 25%),
          linear-gradient(180deg, #090d18 0%, #0f172d 50%, #090d18 100%);
        color: var(--text);
        font-family: "Inter", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        padding: 36px 28px;
        border-radius: 24px;
        background: rgba(16, 22, 39, 0.82);
        border: 1px solid var(--line);
        box-shadow: 0 30px 80px rgba(4, 8, 18, 0.55);
        backdrop-filter: blur(12px);
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.35rem; margin-bottom: 8px; }
      .brand-mark {
        display: grid; place-items: center;
        width: 40px; height: 40px; border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #090d18; font-weight: 900;
      }
      p.sub { margin: 0 0 24px; color: var(--muted); }
      label { display: block; font-size: 0.9rem; font-weight: 600; margin: 16px 0 6px; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        outline: none;
      }
      input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(141, 125, 255, 0.25); }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 13px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #090d18;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      .error {
        display: none;
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 138, 154, 0.12);
        border: 1px solid rgba(255, 138, 154, 0.35);
        color: var(--danger);
        font-size: 0.92rem;
      }
      .error.show { display: block; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="brand-mark">B</span><span>BookRift</span></div>
      <p class="sub">Платформаға кіру үшін логин мен парольді енгізіңіз.</p>

      <form method="POST" action="/api/login">
        <label for="login">Логин</label>
        <input id="login" name="login" type="text" autocomplete="username" required autofocus />

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <div class="error" id="error" role="alert">Логин немесе пароль қате.</div>

        <button type="submit">Кіру</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).has('error')) {
        document.getElementById('error').classList.add('show');
      }
    </script>
  </body>
</html>
